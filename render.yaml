databases:
  - name: tivoli-erp-db
    databaseName: tivoli_erp
    user: tivoli_erp
    postgresMajorVersion: "16"
    region: oregon
    plan: 0.1c-256mb
    ipAllowList: []

services:
  - type: web
    name: tivoli-erp
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    dockerCommand: "sh -c 'python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-10000} --workers ${WEB_CONCURRENCY:-2} --access-logfile - --error-logfile -'"
    healthCheckPath: /healthz/
    initialDeployHook: python manage.py seed_demo && python manage.py create_render_admin
    disk:
      name: tivoli-erp-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: demo
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tivoli-erp-db
          property: connectionString
      - key: RENDER_INITIAL_ADMIN_PASSWORD
        sync: false
      - key: DJANGO_MEDIA_ROOT
        value: /var/data/media
      - key: DJANGO_COOKIE_SECURE
        value: "true"
      - key: AUDIT_TRUST_X_FORWARDED_FOR
        value: "true"
